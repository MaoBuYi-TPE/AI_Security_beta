repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        # fixture 與 vendored 的 nuclei 模板是逐位元組的真實檔案（sha256 鎖定），不得改寫。
        exclude: ^(tests/fixtures/|src/secscan/scanners/domain/nuclei/templates/)
      - id: end-of-file-fixer
        exclude: ^(tests/fixtures/|src/secscan/scanners/domain/nuclei/templates/)
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  # Python 工具都透過 uv 執行，版本與 uv.lock 一致，不在這裡另外鎖版本。
  - repo: local
    hooks:
      # .gitignore 擋得住一般的 git add，擋不住 git add -f；.env 裡有真實的本機密碼。
      # 兩個規則都不分大小寫（(?i)；G1d）：macOS 預設的檔案系統不分大小寫，git add -f .ENV、
      # SECRETS/… 指的是同一個檔案。允許的只有小寫的 .env.example。
      - id: forbid-env-files
        name: 禁止提交 .env（只允許 .env.example）
        entry: 不能提交 .env 檔案；範例請寫在 .env.example
        language: fail
        files: (?i)(^|/)\.env(\..*)?$
        exclude: (^|/)\.env\.example$
      # compose secrets 的秘密檔（T23b-b2；docs/DECISIONS.md §32）：make secrets 寫在 secrets/，
      # .gitignore 的 **/secrets/ 擋不住 git add -f。任何一層的 secrets/ 目錄都擋下。
      - id: forbid-secret-files
        name: 禁止提交 secrets/ 中的檔案
        entry: 不能提交 secrets/ 中的檔案（compose secrets 的秘密檔，由 make secrets 從 .env 產生）
        language: fail
        files: (?i)(^|/)secrets/
      # 平台 API key 的固定格式（docs/DECISIONS.md §9.1）。測試以程式組出 key，文件用 <佔位符>，
      # 所以任何檔案出現完整格式的 key，都當成外洩擋下。
      - id: forbid-platform-api-keys
        name: 禁止提交平台 API key
        entry: secscan_[0-9a-f]{16}_[0-9a-f]{64}
        language: pygrep
        types: [text]
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run --locked mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: lint-imports
        name: import-linter
        entry: uv run --locked lint-imports
        language: system
        types_or: [python, pyi]
        pass_filenames: false
