repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^tests/fixtures/ # fixture 是逐位元組的真實工具輸出，不得改寫
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  # Python 工具都透過 uv 執行，版本與 uv.lock 一致，不在這裡另外鎖版本。
  - repo: local
    hooks:
      # .gitignore 擋得住一般的 git add，擋不住 git add -f；.env 裡有真實的本機密碼。
      - id: forbid-env-files
        name: 禁止提交 .env（只允許 .env.example）
        entry: 不能提交 .env 檔案；範例請寫在 .env.example
        language: fail
        files: (^|/)\.env(\..*)?$
        exclude: (^|/)\.env\.example$
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run --locked mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: lint-imports
        name: import-linter
        entry: uv run --locked lint-imports
        language: system
        types_or: [python, pyi]
        pass_filenames: false
