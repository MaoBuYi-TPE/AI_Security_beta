# 語意規則群組（T19；docs/DECISIONS.md §25.3、docs/TOOLS.md §8）。人工審查、有版本，sha256 釘選在
# secscan/findings/domain/taxonomy.py 的 RULE_GROUPS_SHA256（改這個檔就要更新它與 version）。
#
# - 成員是 (engine, rule, variant)：rule 是 observation 的 source_rule；variant 是 rule_variant（ZAP 的
#   alertRef 等於 pluginid 時、或 Nuclei 沒有 matcher 名時省略）。對不到的觀察走 fallback
#   `engine:rule[:variant]`，永遠單一引擎、標 needs_review。
# - 成員跨引擎的群組必須 reviewed 並寫下 evidence（實際的同時命中）；provisional 只能單一引擎。
# - granularity：parameter（預設，參數名是 fingerprint 的一部分）或 endpoint（參數是群組身分的一部分，
#   例如缺的 header 名稱；兩個工具對參數的回報不同，ZAP 給 header 名、Nuclei 沒有）。
# - cwe 是審查後的值，必須是成員工具自己回報的 CWE 之一（契約測試核對），不為了對應 OWASP 改 CWE。
# - owasp_api_2023 是 curated 對應，每筆要有 rationale（依官方分類頁；docs/SOURCES.md S106）。
# 只收 2026-11-03 之前真實輸出出現過的規則（CLAUDE.md §1）；動態的 variant（tech-detect 的技術名、
# fingerprinthub 的指紋名）與需要判斷嚴重程度的規則（werkzeug-debugger-detect）留給 fallback。
schema: 1
version: "1"
groups:
  # --- 跨引擎（evidence 是 fixture 弱點版 GET / 的同一個回應，T18 的 e2e，docs/TOOLS.md §8.2）---
  - id: cors-permissive-policy
    title: Permissive cross-origin resource sharing (CORS) policy
    kind: security
    cwe: 942
    granularity: endpoint
    owasp_api_2023:
      category: API8:2023
      rationale: >-
        API8:2023 Security Misconfiguration 列出「A Cross-Origin Resource Sharing (CORS) policy is
        missing or improperly set」。
    review:
      status: reviewed
      evidence: >-
        T30-FX-06：fixture 弱點版對同一個 CORS 政策（沒有 Origin 時回 *、有 Origin 時反射並帶
        Allow-Credentials），ZAP 10098 與 nuclei cors-misconfig 都在 GET / 命中
        （recordings/fixture/fixture-vuln-web、recordings/fixture-nuclei/fixture-nuclei-vuln）。
        CWE 取 nuclei 分類中的 CWE-942；ZAP 的 CWE-264 是 CWE 的分類節點。
    members:
      - engine: zap
        rule: "10098"
      - engine: nuclei
        rule: cors-misconfig
        variant: arbitrary-origin
  - id: csp-header-missing
    title: Content-Security-Policy header not set
    kind: security
    cwe: 693
    granularity: endpoint
    owasp_api_2023:
      category: API8:2023
      rationale: >-
        API8:2023 列出「Security or cache control directives are not sent to clients」，預防措施
        要求「include applicable Security Headers」。
    review:
      status: reviewed
      evidence: >-
        T30-FX-05：fixture 弱點版的回應沒有 Content-Security-Policy，ZAP 10038-1 與 nuclei
        http-missing-security-headers:content-security-policy 都在 GET / 命中；修補版補上之後兩者都
        沒有出現。
    members:
      - engine: zap
        rule: "10038"
        variant: 10038-1
      - engine: nuclei
        rule: http-missing-security-headers
        variant: content-security-policy
  - id: x-content-type-options-missing
    title: X-Content-Type-Options header missing
    kind: security
    cwe: 693
    granularity: endpoint
    owasp_api_2023:
      category: API8:2023
      rationale: >-
        API8:2023 列出「Security or cache control directives are not sent to clients」，預防措施
        要求「include applicable Security Headers」。
    review:
      status: reviewed
      evidence: >-
        T30-FX-05：fixture 弱點版沒有 X-Content-Type-Options，ZAP 10021（參數是 header 名）與 nuclei
        http-missing-security-headers:x-content-type-options（沒有參數）都在 GET / 命中。
    members:
      - engine: zap
        rule: "10021"
      - engine: nuclei
        rule: http-missing-security-headers
        variant: x-content-type-options
  - id: anti-clickjacking-header-missing
    title: Anti-clickjacking header missing
    kind: security
    cwe: 1021
    granularity: endpoint
    owasp_api_2023:
      category: API8:2023
      rationale: >-
        API8:2023 列出「Security or cache control directives are not sent to clients」，預防措施
        要求「include applicable Security Headers」。
    review:
      status: reviewed
      evidence: >-
        T30-FX-05：fixture 弱點版沒有 X-Frame-Options（也沒有 CSP frame-ancestors），ZAP 10020-1 與
        nuclei http-missing-security-headers:x-frame-options 都在 GET / 命中。CWE 取 ZAP 的
        CWE-1021（比 nuclei 的 CWE-693 具體）。
    members:
      - engine: zap
        rule: "10020"
        variant: 10020-1
      - engine: nuclei
        rule: http-missing-security-headers
        variant: x-frame-options

