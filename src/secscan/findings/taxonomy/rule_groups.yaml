# 語意規則群組（T19；docs/DECISIONS.md §25.3、§25.14、docs/TOOLS.md §8）。人工審查、有版本，sha256
# 釘選在 secscan/findings/domain/taxonomy.py 的 RULE_GROUPS_SHA256（改這個檔就要更新它與 version）。
#
# - 成員是 (engine, rule, variant)，一個群組只有一個引擎：rule 是 observation 的 source_rule；variant 是
#   rule_variant（ZAP 的 alertRef 等於 pluginid 時、或 Nuclei 沒有 matcher 名時省略）。`*` 只用在技術
#   識別：技術名是動態的，finding 以 `群組/技術名` 保留它。對不到的觀察走 fallback
#   `engine:rule[:variant]`：單一引擎、unclassified、needs_review。
# - 跨引擎（使用者簽核，2026-11-04）：群組以錨點引擎（ZAP）的偵測條件為準；`corroborated_by` 的成員
#   只有在同一次 scan、同一個 method 與 path 有錨點的觀察時才併入，否則留在它自己的群組。必須
#   reviewed 並寫下 evidence。`related` 只標示相關、不合併（偵測的行為不同，例如 CORS）。
# - kind／category：security 分 vulnerability（偵測條件顯示可被利用的行為）與 misconfiguration（缺少
#   或設定不當的防護）；informational 分 technology、detection、hardening（不適用於受測情境或防護條件
#   不完整的強化建議）。人工 triage 之前，兩者都不是已驗證的漏洞。
# - granularity：parameter（預設，參數名是 fingerprint 的一部分）或 endpoint（參數是群組身分的一部分，
#   例如缺的 header 名；ZAP 給 header 名、Nuclei 沒有參數）。
# - cwe 是成員工具自己回報的 CWE（契約測試核對；保留原始 CWE，不為了對應 OWASP 改）。
# - owasp_api_2023 是 curated 對應，每筆要有 rationale（依官方分類頁；docs/SOURCES.md S106）。
# 只收真實輸出出現過的規則（CLAUDE.md §1）。
schema: 2
version: "2"
groups:
  # --- 以 ZAP 為準、Nuclei 在同一次 scan 同一個位置佐證時併入（docs/TOOLS.md §8.2）---
  - id: csp-header-missing
    title: Content-Security-Policy header not set
    kind: security
    category: misconfiguration
    cwe: 693
    granularity: endpoint
    owasp_api_2023:
      category: API8:2023
      rationale: >-
        API8:2023 Security Misconfiguration 列出「Security or cache control directives are not sent
        to clients」，預防措施要求「include applicable Security Headers」。
    review:
      status: reviewed
      evidence: >-
        T30-FX-05：fixture 弱點版的回應沒有 Content-Security-Policy，ZAP 10038-1 與 nuclei
        http-missing-security-headers:content-security-policy 在同一次 scan 的 GET / 都命中；修補版
        補上之後兩者都沒有出現。兩者的條件都是回應沒有 CSP header（nuclei 另外不看 301／302）。
    members:
      - engine: zap
        rule: "10038"
        variant: 10038-1
    corroborated_by:
      - engine: nuclei
        rule: http-missing-security-headers
        variant: content-security-policy
  - id: x-content-type-options-missing
    title: X-Content-Type-Options header missing
    kind: security
    category: misconfiguration
    cwe: 693
    granularity: endpoint
    owasp_api_2023:
      category: API8:2023
      rationale: >-
        API8:2023 列出「Security or cache control directives are not sent to clients」，預防措施
        要求「include applicable Security Headers」。
    review:
      status: reviewed
      evidence: >-
        T30-FX-05：fixture 弱點版沒有 X-Content-Type-Options，ZAP 10021（參數是 header 名）與 nuclei
        http-missing-security-headers:x-content-type-options（沒有參數）在同一次 scan 的 GET / 都命中。
    members:
      - engine: zap
        rule: "10021"
    corroborated_by:
      - engine: nuclei
        rule: http-missing-security-headers
        variant: x-content-type-options
  - id: anti-clickjacking-header-missing
    title: Anti-clickjacking protection missing (no X-Frame-Options or CSP frame-ancestors)
    kind: security
    category: misconfiguration
    cwe: 1021
    granularity: endpoint
    owasp_api_2023:
      category: API8:2023
      rationale: >-
        API8:2023 列出「Security or cache control directives are not sent to clients」，預防措施
        要求「include applicable Security Headers」。
    review:
      status: reviewed
      evidence: >-
        T30-FX-05：ZAP 10020-1 的條件是既沒有 X-Frame-Options 也沒有 CSP frame-ancestors；nuclei 的
        x-frame-options 只看 X-Frame-Options。fixture 弱點版兩者都沒有，ZAP 10020-1 與 nuclei 在同一次
        scan 的 GET / 都命中。nuclei 單獨命中時（frame-ancestors 可能存在）留在
        nuclei-x-frame-options-missing。
    members:
      - engine: zap
        rule: "10020"
        variant: 10020-1
    corroborated_by:
      - engine: nuclei
        rule: http-missing-security-headers
        variant: x-frame-options

  # --- CORS：兩個工具偵測的行為不同，只標示相關、不合併（使用者簽核，2026-11-04）---
  - id: zap-cors-wildcard-origin
    title: "Cross-domain misconfiguration (Access-Control-Allow-Origin: *)"
    kind: security
    category: misconfiguration
    cwe: 264
    granularity: endpoint
    owasp_api_2023:
      category: API8:2023
      rationale: >-
        API8:2023 Security Misconfiguration 列出「A Cross-Origin Resource Sharing (CORS) policy is
        missing or improperly set」。
    review:
      status: reviewed
      evidence: >-
        ZAP 10098 的證據是沒有 Origin 的請求得到 Access-Control-Allow-Origin: *（T30-FX-06、Juice
        Shop）。CWE 保留 ZAP 回報的 CWE-264（CWE 的分類節點，不在 Top 10:2025 的清單）。
    members:
      - engine: zap
        rule: "10098"
    related:
      - nuclei-cors-arbitrary-origin-with-credentials
  - id: nuclei-cors-arbitrary-origin-with-credentials
    title: CORS reflects an arbitrary Origin and allows credentials
    kind: security
    category: vulnerability
    cwe: 942
    granularity: endpoint
    owasp_api_2023:
      category: API8:2023
      rationale: >-
        API8:2023 Security Misconfiguration 列出「A Cross-Origin Resource Sharing (CORS) policy is
        missing or improperly set」。
    review:
      status: reviewed
      evidence: >-
        nuclei cors-misconfig:arbitrary-origin 的條件是回應反射任意 Origin 並帶
        Access-Control-Allow-Credentials: true（主動送出隨機 Origin；T30-FX-06）。CWE 取模板分類中的
        CWE-942（parser 記下的是第一個 CWE-346）。
    members:
      - engine: nuclei
        rule: cors-misconfig
        variant: arbitrary-origin

  # --- Nuclei 單獨命中的 header 檢查（T18 的錄製）---
  - id: nuclei-csp-header-missing
    title: Content-Security-Policy header missing (nuclei)
    kind: security
    category: misconfiguration
    cwe: 693
    granularity: endpoint
    owasp_api_2023:
      category: API8:2023
      rationale: API8:2023 要求「include applicable Security Headers」；回應沒有 CSP header。
    review:
      status: reviewed
      evidence: nuclei http-missing-security-headers:content-security-policy（條件：沒有 CSP header）。
    members:
      - engine: nuclei
        rule: http-missing-security-headers
        variant: content-security-policy
  - id: nuclei-x-content-type-options-missing
    title: X-Content-Type-Options header missing (nuclei)
    kind: security
    category: misconfiguration
    cwe: 693
    granularity: endpoint
    owasp_api_2023:
      category: API8:2023
      rationale: API8:2023 要求「include applicable Security Headers」；回應沒有 XCTO header。
    review:
      status: reviewed
      evidence: nuclei http-missing-security-headers:x-content-type-options（條件：沒有 XCTO header）。
    members:
      - engine: nuclei
        rule: http-missing-security-headers
        variant: x-content-type-options
  # 防護條件不完整：只看 X-Frame-Options，不看 CSP frame-ancestors，不能證明缺 anti-clickjacking 防護。
  - id: nuclei-x-frame-options-missing
    title: X-Frame-Options header missing (CSP frame-ancestors not checked)
    kind: informational
    category: hardening
    cwe: 693
    granularity: endpoint
    review:
      status: reviewed
      evidence: >-
        nuclei http-missing-security-headers:x-frame-options（條件：沒有 X-Frame-Options）。ZAP 10020-1
        在同一次 scan 的同一個位置也命中時，改併入 anti-clickjacking-header-missing。
    members:
      - engine: nuclei
        rule: http-missing-security-headers
        variant: x-frame-options
  # 其他缺少的 header：nuclei 標 info、ZAP 不回報，在 HTTP 的 lab 中不適用或不是可利用的弱點
