[project]
name = "secscan"
version = "0.1.0"
description = "Web/API 多引擎動態安全檢測後端（畢業專題）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "cryptography>=50.0.2",
    "docker>=7.2.0",
    "fastapi>=0.143.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
# 本機管理指令：建立 platform_admin key（docs/DECISIONS.md §9.1）。
secscan-admin = "secscan.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.170.2",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.1",
    "types-docker>=7.2.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
# 文件中的 Python 區塊是示意用的概念介面（例如 ARCHITECTURE.md §4），不交給 formatter 改寫。
exclude = ["*.md"]

[tool.ruff.lint]
# S：安全規則（flake8-bandit）；BLE：禁止 except Exception；T20：禁止 print。
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "BLE", "T20", "SIM", "PT", "C4", "RUF"]
# 中文註解與文件字串使用的全形標點。
allowed-confusables = ["，", "：", "；", "（", "）", "！", "？", "／"]

[tool.ruff.lint.per-file-ignores]
# S105/S106：測試用的假密碼（真實秘密只在 .env 與執行期產生，fixture 另有防洩密測試）。
"tests/**/*.py" = ["S101", "S105", "S106"]
# insecure.py 是 T30 自製 fixture app 的弱點版靶機（只在隔離的 lab_net 執行）：
# S608 的 SQL 字串拼接正是要量測的注入弱點，不是程式缺陷。
"tests/live/fixture_app/insecure.py" = ["S608"]
# spikes/ 是 T03 一次性探查腳本（在容器內以 mitmproxy/python 執行，不屬於 src）。
# 需要 stdout 輸出（T201）與在隔離 lab_net 綁 0.0.0.0（S104）。不納入 mypy。
# N802/N815：BaseHTTPRequestHandler 要求 do_GET 等固定命名。
"spikes/**/*.py" = ["T201", "S104", "N802", "N815"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# unit/contract 測試不得出網：pytest-socket 封鎖 TCP/UDP 與 DNS 查詢。
# AF_UNIX 必須整個放行（asyncio 需要 socketpair）：tests/isolation.py 另外只允許 connect 到 pytest
# 暫存目錄底下的 Unix socket，並把 DOCKER_HOST 指向不存在的 socket（docs/DECISIONS.md §14.9）。
# coverage 門檻放在 make test；單獨執行某個測試檔時不會因門檻而失敗。
addopts = [
    "--strict-markers",
    "--strict-config",
    "--disable-socket",
    "--allow-unix-socket",
]
xfail_strict = true
# psycopg 經 libpq 連線，不受 pytest-socket 影響：非整合測試由 tests/conftest.py 封鎖 DB 連線；
# 整合測試只連 loopback 上 cluster_name=secscan-test 的 db-test（tests/integration/database.py）。
markers = [
    "integration: 需要 db-test（make test-db-up）；以 -m 'not integration' 可只跑離線測試",
    "live: 連到真的 Docker 或 lab；要 ENABLE_LIVE_LAB_TESTS=1 才執行，make test 不跑",
]

[tool.coverage.run]
branch = true
# 用路徑而不是套件名稱：Alembic 以自訂模組名稱（env_py…）載入 env.py 與 migration 檔，
# 依套件名稱比對會把這些實際執行過的程式漏算成 0%。
source = ["src/secscan"]

[tool.importlinter]
root_package = "secscan"
# forbidden contract 要檢查第三方套件（fastapi、sqlalchemy…），必須把它們納入 import graph。
include_external_packages = true

# 依賴方向（上層可以 import 下層，反之不行；理由見 docs/DECISIONS.md §8、§9.4、§10.7、§11.7、§12.7、§13.9、
# §14.10、§15.9）：
# - main 組裝 app，cli 是本機管理指令；兩者都是程序入口。migrations 登記所有 ORM model。
# - 功能模組依實際呼叫關係排列：scans 建立 scan 時要用 gate（grants）、inventory（specs）與
#   profile 的版本（auth_profiles）；runner（容器）與 worker（解析）只經 scans 的佇列操作 run，
#   並以 scanners 建 ExecutionPlan、寫心跳；specs 要鎖住 target，並以 grant 預覽 inventory；
#   auth_profiles 要鎖住 target、得知所屬 project（與 specs 同一層、互不依賴）；
#   guard（egress guard 的 addon 與 policy 的格式）以 grants 的 scope 規則逐請求檢查，runner 寫
#   policy；它在 mitmproxy 的映像中執行，只能用標準函式庫與純 domain（見下方的 contract）；
#   grants 要鎖住 target、得知所屬 project；targets 要確認 project
#   存在；projects 會用 api_keys 的身分驗證與 audit；api_keys 撤銷 key 時寫 audit；
#   audit 依賴 security 的遮罩。
# - security 是共用的安全元件（key 雜湊、遮罩、目標 secret 的加密），只依賴 core 的純模組
#   與 cryptography。
# - 跨功能的 FK 以資料表名稱引用，不 import 對方的 model。
# exhaustive：secscan 底下每個頂層模組都必須列在 layers，新模組不會默默繞過檢查；
# 同一層以 "a | b" 並列（彼此獨立）。只有 runner.docker_runtime 能 import docker（見下方）。
[[tool.importlinter.contracts]]
name = "Layers: main -> migrations -> features -> security -> core"
type = "layers"
containers = ["secscan"]
exhaustive = true
layers = [
    "main | cli",
    "migrations",
    "health | runner | worker",
    "scanners",
    "scans",
    "specs | auth_profiles | guard",
    "grants",
    "targets",
    "projects",
    "api_keys",
    "audit",
    "security",
    "core",
]

# domain 規則（狀態機、scope 比對、fingerprint…）與 security 元件不得依賴 Web 框架、DB 或 Docker
# （CLAUDE.md §5）。規則一律放在 <feature>/domain.py，或拆成 <feature>/domain/ 套件（子模組也受檢查）。
# 預設也檢查間接 import：只能用標準函式庫、security 與 core 中的純模組（json_types、text）；
# 例外是 specs 的 domain 以 PyYAML 純 Python 的事件 API 解析 YAML（docs/DECISIONS.md §11.2），
# 以及 security 以 cryptography 的 MultiFernet 加密目標的 secret（§12.1）。
[[tool.importlinter.contracts]]
name = "Domain and security modules stay free of frameworks, DB and Docker"
type = "forbidden"
source_modules = [
    "secscan.*.domain",
    "secscan.*.domain.**",
    "secscan.security",
    "secscan.security.**",
]
forbidden_modules = ["fastapi", "starlette", "sqlalchemy", "alembic", "psycopg", "docker"]

# egress guard 在官方 mitmproxy 映像（Python 3.14）中執行，映像內沒有我們的相依套件
# （docs/DECISIONS.md §15.1）：guard 只能用標準函式庫與純 domain 模組。預設也檢查間接 import。
[[tool.importlinter.contracts]]
name = "Guard runs on the standard library only"
type = "forbidden"
source_modules = ["secscan.guard"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "alembic",
    "psycopg",
    "docker",
    "pydantic",
    "pydantic_settings",
    "yaml",
    "cryptography",
    "uvicorn",
]

# 加密只經由 security.secret_cipher（docs/DECISIONS.md §12.2）：其他模組不得直接使用 cryptography，
# 解密只能透過 SecretCipher.reveal（AST 測試確認 src 中沒有呼叫者），不會繞過去自己解。
# 預設也檢查間接 import，所以只忽略 secret_cipher 自己的那一條。
[[tool.importlinter.contracts]]
name = "Only security.secret_cipher uses cryptography"
type = "forbidden"
source_modules = ["secscan"]
forbidden_modules = ["cryptography"]
ignore_imports = ["secscan.security.secret_cipher -> cryptography"]

# Docker 只經由 runner.docker_runtime（CLAUDE.md §5、docs/DECISIONS.md §14.2）：api、worker 與其他模組
# 都不能 import Docker SDK。預設也檢查間接 import，所以只忽略 docker_runtime 自己的那一條。
[[tool.importlinter.contracts]]
name = "Only runner.docker_runtime uses the Docker SDK"
type = "forbidden"
source_modules = ["secscan"]
forbidden_modules = ["docker"]
ignore_imports = ["secscan.runner.docker_runtime -> docker"]

[tool.alembic]
# migration 放在套件內，和其他程式一樣受 ruff、mypy 與 coverage 檢查。
script_location = "%(here)s/src/secscan/migrations"
# 檔名必須是合法的 Python 模組名稱（mypy 才能檢查）。revision id 用四位數流水號：
#   uv run alembic revision --autogenerate --rev-id 0002 -m "<說明>"
file_template = "v%%(rev)s_%%(slug)s"
timezone = "UTC"
truncate_slug_length = 40
# 依賴已裝在 venv；不把工作目錄加進 sys.path，避免載入工作目錄中意外的同名模組。
prepend_sys_path = []

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_fix"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"
